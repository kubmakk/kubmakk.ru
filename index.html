<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iOS Developer Portfolio</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700" rel="stylesheet">

  <style>
    /* Сброс и базовые настройки */
    * {
      box-sizing: border-box;
    }

    body {
      /* Убрали flex из body, чтобы при скролле не обрезался верхний край на мобилках */
      display: block; 
      min-height: 100dvh; 
      background: radial-gradient(circle at 50% 50%, #3a3a3a 0%, #1a1a1a 40%, #000000 100%);
      margin: 0;
      /* overflow: hidden; - УБРАЛИ, чтобы можно было скроллить вниз к барабанам */
      overflow-x: hidden; /* Блокируем только горизонтальный скролл */
      font-family: system-ui, -apple-system, sans-serif;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100dvh; /* Контейнер растягивается на весь экран и центрирует контент */
      padding: 60px 20px 40px 20px; /* Отступы, чтобы контент не прилипал к краям при скролле */
    }

    /* --- SVG (Адаптация) --- */
    svg {
      width: 85vmin; 
      height: 85vmin;
      max-width: 500px;
      max-height: 500px;
      margin-bottom: 30px; 
    }

    svg #blobClip {
      transform-origin: center;
      transition: ease-out transform .4s;
    }

    svg:hover #blobClip {
      transform: scale(1.15);
    }

    svg:hover .text-content {
      fill: #ef5350;
      text-shadow: 0 0 10px rgba(239, 83, 80, 0.5);
      mix-blend-mode: normal;
    }

    .text-content {
      font: 700 10px/1.2 "Montserrat", system-ui, sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: rgba(255, 255, 255, 0.9);
      mix-blend-mode: normal;
      transition: ease all .5s;
      pointer-events: none;
    }

    /* --- Соц сети (Адаптация) --- */
    .social-menu {
      display: flex;
      gap: 30px; 
      z-index: 10;
      flex-wrap: wrap; 
      justify-content: center;
    }

    .social-menu a {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80px;
      height: 80px;
      font-size: 32px;
      background-color: #262626;
      border: 1px solid #333;
      border-radius: 50%;
      text-decoration: none;
      color: #e0e0e0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent; 
    }

    .social-menu a:hover, .social-menu a:active {
      transform: translateY(-5px) scale(1.1);
      background-color: #333;
      color: #ef5350;
      box-shadow: 0 15px 35px rgba(239, 83, 80, 0.2);
      border-color: #ef5350;
    }

    /* --- НОВЫЙ БЛОК: БАРАБАНЫ --- */
    .drums-promo {
      margin-top: 60px; /* Отступ от кнопок соцсетей */
      display: flex;
      align-items: center;
      background-color: #262626;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .drums-promo:hover {
      transform: translateY(-5px);
      border-color: #ef5350;
      box-shadow: 0 15px 35px rgba(239, 83, 80, 0.2);
    }

    .drums-img {
      width: 120px;
      height: 120px;
      border-radius: 15px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .drums-content {
      display: flex;
      flex-direction: column;
    }

    .drums-content h2 {
      margin: 0 0 10px 0;
      font-family: "Montserrat", sans-serif;
      color: #fff;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .drums-content p {
      margin: 0 0 15px 0;
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    .drums-btn {
      align-self: flex-start;
      padding: 10px 20px;
      background-color: #ef5350;
      color: #fff;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.3s ease, transform 0.2s;
    }

    .drums-btn i {
      margin-right: 5px;
    }

    .drums-btn:hover {
      background-color: #d32f2f;
      transform: scale(1.05);
    }

    /* --- МЕДИА ЗАПРОСЫ (Для телефонов) --- */
    @media (max-width: 768px) {
      .social-menu { gap: 20px; }
      .social-menu a {
        width: 60px; height: 60px; font-size: 24px;
      }
      svg { margin-bottom: 20px; }
      
      /* Адаптация блока барабанов для мобилок */
      .drums-promo {
        flex-direction: column;
        text-align: center;
        padding: 25px 15px;
      }
      .drums-btn {
        align-self: center; /* Центрируем кнопку на телефонах */
      }
    }

    @media (max-width: 380px) {
      .social-menu a {
        width: 50px; height: 50px; font-size: 20px;
      }
    }

    /* --- DEV BADGE --- */
    #dev {
      font-family: "Montserrat", sans-serif;
      position: fixed;
      font-size: 12px;
      top: 15px;
      left: 15px;
      padding: 0.8em 1.2em;
      color: #fff;
      background-color: #222;
      border-radius: 25px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }
    
    #dev a {
        text-decoration: none;
        color: white;
    }
  </style>
</head>
<body>
